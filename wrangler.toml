name = "booksoutloud"
compatibility_date = "2025-05-01"
pages_build_output_dir = "public"

# Non-secret config. Secrets (RESEND_API_KEY) are set via:
#   wrangler pages secret put RESEND_API_KEY
# or the Cloudflare dashboard under Pages → Settings → Environment variables.
[vars]
BOOKING_TO_EMAIL = "jer@jeromydarling.com"
BOOKING_FROM_EMAIL = "Books, Out Loud <gardener@thecros.app>"
SITE_URL = "https://booksoutloud.org"
# Email allowed to access /admin/*. Must match the address you authorize in
# Cloudflare Access. Override per-environment in the dashboard if needed.
ADMIN_EMAIL = "jeromy.darling@gmail.com"

# D1 (SQLite) database for the CRM.
# One-time setup:
#   wrangler d1 create booksoutloud-crm
# then paste the printed database_id below and run:
#   wrangler d1 execute booksoutloud-crm --remote --file=migrations/0001_init.sql
[[d1_databases]]
binding = "DB"
database_name = "booksoutloud-crm"
database_id = "b6ddd699-dabf-43d1-a1e2-c30ba94f0275"
